services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db

  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-20-bookworm
    volumes:
      - ..:/workspaces/mongodb-lab:cached
    command: sleep infinity
    network_mode: service:mongodb
    depends_on:
      - mongodb

volumes:
  mongodb-data:
